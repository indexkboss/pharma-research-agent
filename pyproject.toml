[project]
name = "pharma-research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "numpy>=2.4.6",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pharma-research-agent = "pharma_research_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
